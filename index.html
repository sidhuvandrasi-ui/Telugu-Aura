<style>
:root {
  --bg: #080808;
  --silver: #e6e6e6;
  --muted: #999999;
  --line: rgba(255,255,255,.13);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  min-height: 100vh;
  min-height: 100svh;
  font-family: 'Noto Sans Telugu', sans-serif;
  color: #fff;
  background:

  justify-content: center;

  padding: 20px 16px;

body::before {

.page {

  width: 100%;
  max-width: 410px;

}

.page::before {
  content: "";

  top: 0;
  left: 14%;

}

.inner {

  align-items: center;

  color: #d2d2d2;
  font-size: 11px;
  letter-spacing: 1.3px;
}

.top-label::before {
  content: "";

  height: 6px;

}

.logo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  background: #111;
}

.brand {
  font-family: 'Inter', 'Noto Sans Telugu', sans-serif;
  font-size: clamp(25px, 7.5vw, 34px);
  line-height: 1.35;
  font-weight: 900;
  letter-spacing: 1.5px;
  background: linear-gradient(180deg, #fff 5%, #e0e0e0 35%, #858585 75%, #f4f4f4 100%);

  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 12px rgba(255,255,255,.1));
}

.divider {
  width: 76px;
  height: 2px;
  margin: 17px auto;
  background: linear-gradient(90deg, transparent, #e5e5e5, transparent);
}

.headline {

  font-weight: 800;
  line-height: 1.65;

}

  margin: 12px auto 0;
  color: #a9a9a9;
  font-size: 13px;
  line-height: 2;
  font-weight: 400;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 24px 0 21px;
}

.stat {
  padding: 13px 8px;
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 15px;
  background: rgba(255,255,255,.035);
}

.stat-title {
  color: #f1f1f1;
  font-size: 13px;
  font-weight: 700;
}

.stat-sub {
  color: #8f8f8f;
  font-size: 10px;
  margin-top: 5px;
}

.join-btn {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 58px;
  padding: 14px 12px;
  border: 1px solid #f5f5f5;
  border-radius: 15px;
  background: linear-gradient(135deg, #f7f7f7, #c7c7c7 55%, #f1f1f1);

    inset 0 1px 0 #fff;
  color: #101010;
  font-family: 'Noto Sans Telugu', sans-serif;
  font-size: 16px;
  font-weight: 800;
  text-decoration: none;
  transition: transform .2s ease, box-shadow .2s ease;
}

.join-btn:active {
  transform: scale(.98);
}

.join-btn svg {
  width: 23px;
  height: 23px;
  flex-shrink: 0;
}

.footer {
  margin-top: 17px;
  color: #777;
  font-size: 10px;
  letter-spacing: .4px;
}

.footer span {
  color: #cfcfcf;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 360px) {

@media (prefers-reduced-motion: reduce) {
